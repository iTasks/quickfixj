# DSE-BD (Dhaka Stock Exchange, Bangladesh) FIX Server Configuration
# This server accepts FIX 4.4 connections from trading clients on port 5001

[default]
FileStorePath=target/data/dse-server
ConnectionType=acceptor
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
SenderCompID=DSE-BD
TargetCompID=TRADER
UseDataDictionary=Y

[session]
BeginString=FIX.4.4
SocketAcceptPort=5001
