# CSE-BD (Chittagong Stock Exchange, Bangladesh) FIX Server Configuration
# This server accepts FIX 4.4 connections from trading clients on port 5002

[default]
FileStorePath=target/data/cse-server
ConnectionType=acceptor
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
SenderCompID=CSE-BD
TargetCompID=TRADER
UseDataDictionary=Y

[session]
BeginString=FIX.4.4
SocketAcceptPort=5002
