# DSE-BD (Dhaka Stock Exchange, Bangladesh) FIX Client Configuration
# This client connects to the DSE-BD FIX server on port 5001

[default]
FileStorePath=target/data/dse-client
ConnectionType=initiator
SenderCompID=TRADER
TargetCompID=DSE-BD
SocketConnectHost=localhost
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
ReconnectInterval=5

[session]
BeginString=FIX.4.4
SocketConnectPort=5001
