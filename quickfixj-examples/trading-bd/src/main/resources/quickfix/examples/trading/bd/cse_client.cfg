# CSE-BD (Chittagong Stock Exchange, Bangladesh) FIX Client Configuration
# This client connects to the CSE-BD FIX server on port 5002

[default]
FileStorePath=target/data/cse-client
ConnectionType=initiator
SenderCompID=TRADER
TargetCompID=CSE-BD
SocketConnectHost=localhost
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
ReconnectInterval=5

[session]
BeginString=FIX.4.4
SocketConnectPort=5002
